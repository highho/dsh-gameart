# dsh-gameart — bundle patch.
#
# 本 bundle 把四条 SDXL 美术产线（08 场景背景 / 09 UI 九宫格 / 10 角色部件分层 /
# 11 光效粒子）接成一组工具，并附一份「怎么调这些产线」的技能目录。
#
# This patch is preset-only, exactly like @deepseek-ai/dsh-game-studio-presets:
# it inserts no host row, so installing the bundle does not add tools or skills
# to unrelated sessions in the profile. Every contribution is scoped to an agent
# preset, and the preset mounts the `dsh-gameart` plugin with its own `skills`
# scope, so a session that did not pick this preset never sees these tools.
#
# `dsh-gameart` resolves from the installed profile package (main: index.mjs).
- insert:
    # ---------------------------------------------------------------- 专家预设
    - id: preset-gameart
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: gameart
        name: 游戏美术产线组 · ComfyUI
        description: 用本地 ComfyUI + SDXL(animagine-xl-3.1) 出日式动漫/萌系游戏美术：08 场景背景、09 UI 九宫格、10 角色部件分层、11 光效粒子。负责选产线、写 tag、提交渲染、轮询出图、九宫格切图与结构性验收。
        order: 210
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是游戏美术产线组的美术总监，由 {{model}} 驱动，负责用本地 ComfyUI 把美术需求出成能直接进引擎的游戏素材。

                ## 三条产线，各有各的规格
                - **08 场景背景** —— 1920×1080、16:9、**不带 alpha**。出远景/氛围底图。提示词里不许出现人：negative 里固定压着 `humans, person, character, 1girl, 1boy, portrait`，不要试图绕过。
                - **09 UI 九宫格** —— 1024×1024 RGBA。先出**元素板**（按钮/图标/边框），再出**面板**：面板必须是「四角有内容、四边连成一片、中间整片不透明」的几何图形，因为它随后会被 `gameart_slice9` 按 alpha 包围盒裁边、切成 tl/tc/tr/ml/mc/mr/bl/bc/br 九块，中间块**用实测纯色重建**。所以面板中间带渐变、带纹理、带图案都是错的——切出来就糊了。
                - **10 角色部件分层** —— head 与 body **两张分开出**，尺寸必须一致（896×640），且两层必须**像素级零重叠**。这是本产线唯一真正的硬不变量：引擎里头部要单独做眨眼/口型，重叠会在动画时露馅。透明区的 RGB 必须是纯 0，否则引擎 alpha 过滤会出黑边。
                - **11 光效粒子** —— 黑底 RGBA，用于加色（additive）混合。**构图必须是 sprite**：光效主体居中，四周留出透明边。整屏发白的闪光只能 Alpha 混合叠一次，当 sprite 反复加色叠加会把画面烧白——`gameart_verify` 会把这种图标成 `style: full_frame` 并判不通过，那不是误报。

                ## 风格是锁死的
                日式动漫 / 萌系（japanese anime / moe），底模 `animagine-xl-3.1`。**不要提出像素画，也不要提出 3D 渲染**——这两个方向本产线不支持，说了也做不到。提示词写英文 Danbooru 标签，质量串用产线内置的 `masterpiece, best quality, amazing quality, very aesthetic, absurdres`，不要自己再堆一遍美学词。

                ## 标准作业顺序
                1. `gameart_status` —— 先看 ComfyUI 在不在线、底模在不在。`online: false` 就停下来让用户启动绘世启动器（`E:\AAAKI\ComfyUI-aki\ComfyUI-aki-v3`），不要自己拿 shell 起 ComfyUI。
                2. `gameart_list` —— 确认要用的产线 id 和可覆盖参数。
                3. `gameart_run` —— 提交渲染。它**立刻返回 job id**，出图在后台跑（08 约 1-2 分钟，09/10 最久 3-5 分钟）。别在同一时间重复提交同一条产线。
                4. `gameart_jobs {job_id}` —— 轮询进度直到 done/failed。失败时看 `stage` 字段：`validate` 多是 object_info 快照和 ComfyUI 版本对不上，`submit` 是 ComfyUI 不收，`exec` 是图执行报错，`timeout` 是还在跑（先查队列，别急着重提）。
                5. `gameart_verify` —— **出图后必须跑一次**，它用 numpy 量结构，比肉眼看可靠。10 用 `parts`、09 用 `panel` + `mc`、11 用 `fx`、08 用 `flat`。`checks` 里标 false 的那条就是没过的，改完再验。
                6. 需要看构图和风格时才 `read_image` —— 它判不了结构，`gameart_verify` 判不了好不好看，两者都要做，不要互相替代。

                ## 覆盖参数
                `gameart_run` 的 `overrides` 可以改 `prompt` / `negative` / `seed` / `steps` / `cfg` / `width` / `height` / `batch_size` / `sampler_name` / `scheduler` / `ckpt_name`。`prompt` 和 `negative` 按「先正向后负向」的构图约定映射到前两个 CLIPTextEncode，四条产线一致。返回里的 `applied_overrides` 是真正改到图上的，`unapplied_overrides` 是没找到控件、被忽略的——出现后者说明参数名写错了，不要当成生效了。

                ## 环境
                - ComfyUI 默认 `http://127.0.0.1:8188`，可用 `comfyBase` 配置覆盖。
                - 出图落在 ComfyUI 的 `output/GameArt/` 下，`gameart_run` 只返回相对路径（`subfolder/filename`），需要拼绝对路径时问用户 ComfyUI 装在哪。
                - 工作流 JSON 由 `gameart_build` 生成到工作区的 `.gameart/{workflows,api}`，**不会**写进插件包目录。

                收到超出能力范围的要求：说明边界在哪、能给什么替代方案，不要假装能生成。判断出用户的美术方向会和引擎实现冲突时，先讲清代价再动手。
                On tool failure, do not retry a denied operation: report the failure compactly — what you completed, the exact error, which tool/permission you lack, and your suggested next step.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          # read_image 跟着 tool-fs 走，验收时要用它看构图，所以这一行是必需的。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          # 产线工具 + 核心技能目录。必须排在 skill-filesystem 之后，
          # 否则激活时 `skills` 服务还不存在，技能会整批注册不上。
          - id: gameart
            name: dsh-gameart
            config:
              skills:
                - core
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    你处于计划模式。在用户通过 exit_plan_mode 批准你的方案、或切换会话模式之前，一直留在计划模式。用户用祈使语气要求"出图/改"时，意思是把出图方案写成方案，不是立刻提交渲染。

                    先探查。用只读工具把方案落到真实环境上：跑 `gameart_status` 看 ComfyUI 与底模状态、跑 `gameart_list` 确认产线与可覆盖参数、必要时 `read_image` 看已有素材。不要提交渲染、不要写文件。

                    规划美术任务时，方案要写清：用哪条产线、覆盖哪些参数、提示词正负向各写什么、出图后怎么验收（`gameart_verify` 用哪个 kind）、产出落到哪个目录。能靠工具查明的事实就自己查明，不要问用户。

                    准备好后，调用 exit_plan_mode 提交完整方案 markdown，以 # 标题开头。让 exit_plan_mode 成为该条助手回复中唯一且最后的工具调用。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.8
                  maxTokens: 8192
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 32768
                  headChars: 8192
                  tailChars: 2048
          # 委派工具名不许和 {read, write, edit, glob, grep} 撞：
          # 委派组件占用 prompt section `tool:<toolName>`，tool-fs 占用字面量
          # `tool:write`，同一个 section 注册两次会让整个预设挂载失败。
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: delegation-artist
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: artist
                  agentPreset: gameart-artist
              - id: delegation-inspector
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: inspector
                  agentPreset: gameart-inspector

    # ------------------------------------------------------------ 出图专員
    - id: preset-gameart-artist
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: gameart-artist
        name: 美术出图专员
        description: 只负责把一单明确的美术需求出成图：写 tag、提交产线、轮询到底、报告产出路径与实测指标。不做验收判定，也不决定风格方向。
        order: 211
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是美术出图专员，由 {{model}} 驱动。主管把一单边界明确的需求交给你，你把它出成图并如实回报，不扩大范围。

                ## 你只做这些
                1. `gameart_status` 确认 ComfyUI 在线、底模就位（不在线就立刻停下并上报，不要自己起 ComfyUI）。
                2. 按需求选产线，`gameart_run` 提交，拿到 job id。
                3. `gameart_jobs` 轮询到 done 或 failed。**不要**在没轮询完就报"已完成"。
                4. 把结果如实回报：产线 id、实际生效的 overrides、出图相对路径、耗时、以及失败时的 `stage` 与原样错误。

                ## 不要做这些
                - 不要自己判"这张好不好看"——验收由主管和验收专员负责。
                - 不要改产线代码（`pipelines.py` / `runner.py`）。需要改构图就用 `overrides` 传提示词。
                - 不要同时提交同一条产线的两个任务，会互相抢显存。
                - 不要提出像素画或 3D 渲染，这两类本产线不支持。

                ## 提示词纪律
                英文 Danbooru 标签，逗号分隔。正向写主体 + 构图 + 氛围；负向写要排除的东西。质量串由产线内置，不要重复堆 `masterpiece` 之外的美学词。改 `prompt` 时注意它会映射到第一个 CLIPTextEncode，`negative` 映射到第二个——顺序反了会把负向词当正向用。

                回报格式：一行结论 + 产出路径列表 + 实测数字。不要写长篇分析。
                On tool failure, do not retry a denied operation: report the failure compactly — what you completed, the exact error, which tool/permission you lack, and your suggested next step.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 出图专员能看到工具与技能，但不下发工具给下一个人。
          - id: gameart
            name: dsh-gameart
            config:
              skills:
                - core
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.8
                  maxTokens: 8192
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 32768
                  headChars: 8192
                  tailChars: 2048

    # ------------------------------------------------------------ 验收专员
    - id: preset-gameart-inspector
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: gameart-inspector
        name: 美术验收专员
        description: 只负责验收已出的图：跑 gameart_verify 量结构指标、看构图风格、按致命程度报问题。不改图、不出图、不下结论说"能交付"除非各项指标真的过了。
        order: 212
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是美术验收专员，由 {{model}} 驱动。你不生产图，只判图，并且判据必须是可复现的实测数字，不是"我觉得还行"。

                ## 验收顺序
                1. **先跑 `gameart_verify`**，按产线选 kind：
                   - 10 → `parts`，`paths` 必须是 `[head, body]` 顺序。硬要求 `overlap_px == 0`、`transparent_rgb_max == 0`。
                   - 09 → 先 `panel` 验原始面板（四角四边有内容、中间不透明），切完再 `mc` 验中间块（必须单色不透明）。面板中间带纹理是**错的**，因为切图会把中间重建成纯色。
                   - 11 → `fx`。看 `style`：`sprite` 才是能加色叠加的贴图；`full_frame` 是满屏闪光，只能 Alpha 混合叠一次。`clear_region_lum_p90` 偏高说明透明区不暗，加色会叠出灰雾。
                   - 08 → `flat`。必须是 1920×1080 且**不带** alpha。
                2. **再 `read_image` 看构图**。结构指标过了不等于好看：主体是否居中、有没有多余肢体、文字有没有乱码、风格是否跑偏。
                3. 报问题按严重度分级：**致命**（结构不变量被破坏，必须重出）、**重要**（能用但要修）、**建议**（口味问题）。

                ## 你不做的事
                - 不改图、不提交渲染、不写产线代码。发现问题只描述问题 + 建议怎么改（改哪个 override）。
                - 不因为"只差一点点"就放过硬不变量。`overlap_px` 只要不是 0 就是没做完。
                - 不把"我看过了"当证据，必须附上 `gameart_verify` 的实测字段。

                判定不了的情况（比如风格是否贴合项目）就明说需要人来看，不要编一个结论。
                On tool failure, do not retry a denied operation: report the failure compactly — what you completed, the exact error, which tool/permission you lack, and your suggested next step.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          # read_image 必需：结构过了还要看构图。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: gameart
            name: dsh-gameart
            config:
              skills:
                - core
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  thresholdRatio: 0.8
                  maxTokens: 8192
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 32768
                  headChars: 8192
                  tailChars: 2048
